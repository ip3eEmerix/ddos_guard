plugins {
    id 'java'
}

group = 'org.ip3e'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
    maven {
        url = 'https://repo.dmulloy2.net/repository/public/' // Для ProtocolLib
    }
}

dependencies {
    // Spigot API
    compileOnly 'org.spigotmc:spigot-api:1.20.1-R0.1-SNAPSHOT' // Последняя стабильная версия

    // ProtocolLib (опционально, если нужно работать с пакетами)
    compileOnly 'com.comphenix.protocol:ProtocolLib:4.8.0'

    // JUnit для тестирования (опционально)
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.3'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17) // Убедитесь, что используете Java 17 для новых версий Minecraft
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8' // Установите кодировку UTF-8
}

jar {
    archiveBaseName.set('DDoSGuard')
    from {
        configurations.compileClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}